<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="refresh" content="0;url=/de/imprint/"><link rel="canonical" href="https://neuesleben.church/de/imprint/"><title>Neues Leben</title></head><body><a href="/de/imprint/">Weiter zur Gemeinde Neues Leben</a><script>
let saved;
try { saved = localStorage.getItem('locale'); } catch {}
const language = (saved === 'ua' ? 'uk' : saved) || navigator.language?.split('-')[0];
const locale = ['de', 'en', 'ru', 'uk', 'be'].includes(language) ? language : 'de';
window.location.replace(`/${locale}/imprint/${window.location.hash}`);
</script></body></html>
